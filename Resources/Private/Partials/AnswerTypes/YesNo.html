<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:pnq="http://typo3.org/ns/ProudNerds/PnQuestionnaire/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!--
    Yes / No renders as two radio buttons using the question's own answer options.
    Editors configure exactly two options (Yes and No) via the backend inline editor.
    This keeps the binary choice fully translatable without any hard-coded labels.
-->
<div class="pn-questionnaire__yes-no">
    <f:for each="{question.answerOptions}" as="option">
        <div class="pn-questionnaire__answer-option pn-questionnaire__answer-option--yes-no">
            <f:if condition="{pnq:inArray(haystack: currentAnswer, needle: option.uid)}">
                <f:then>
                    <input type="radio"
                           name="tx_pnquestionnaire_questionnaire[answers][]"
                           aria-required="{f:if(condition: question.required, then: 'true', else: 'false')}"
                           id="answer-{option.uid}"
                           value="{option.uid}"
                           checked="checked"
                           class="pn-questionnaire__radio" />
                </f:then>
                <f:else>
                    <input type="radio"
                           name="tx_pnquestionnaire_questionnaire[answers][]"
                           aria-required="{f:if(condition: question.required, then: 'true', else: 'false')}"
                           id="answer-{option.uid}"
                           value="{option.uid}"
                           class="pn-questionnaire__radio" />
                </f:else>
            </f:if>
            <label for="answer-{option.uid}" class="pn-questionnaire__answer-label">
                {option.label}
            </label>
        </div>
    </f:for>
</div>
</html>
