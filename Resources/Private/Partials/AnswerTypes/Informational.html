<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!--
    Informational questions carry no user input.
    The question text and optional help text/content element are rendered
    by the parent Question.html template — nothing additional is needed here.
    A hidden no-op field ensures the form submission succeeds without answers.
-->
<input type="hidden"
       name="tx_pnquestionnaire_questionnaire[answers][]"
       value="" />
</html>
