<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="content">
    <div class="pn-questionnaire__intro">

        <f:flashMessages />

        <f:if condition="{questionnaire.introductionText}">
            <div class="pn-questionnaire__intro-text">
                {questionnaire.introductionText -> f:format.html()}
            </div>
        </f:if>

        <div class="pn-questionnaire__intro-actions">
            <f:link.action
                action="question"
                class="pn-questionnaire__btn pn-questionnaire__btn--primary"
            >
                <f:translate key="button.start" extensionName="PnQuestionnaire" />
            </f:link.action>
        </div>

    </div>
</f:section>
</html>
